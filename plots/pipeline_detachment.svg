<svg xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 756" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipeline detachment workflow">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" class="ahead"/></marker></defs>
<style>
svg{width:100%;height:auto;display:block;font-family:"Avenir Next","Helvetica Neue","Segoe UI",system-ui,sans-serif}
.lane{fill:#EDF1F6;stroke:#C3CFDA;stroke-width:1}
.lane-l{fill:#EBF4F0}
.lanelabel{font-size:14px;font-weight:700;letter-spacing:.08em;fill:#1C2733}
.lanenote{font-size:12px;fill:#51616F}
.node rect{fill:#FFFFFF;stroke-width:1.5}
.node .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.12em;fill:#51616F}
.node .ntitle{font-size:15px;font-weight:700;fill:#1C2733}
.node .nsub{font-size:11.5px;fill:#51616F}
.mono{font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace}
.st-done rect{stroke:#8CBEA2}
.st-amber rect{stroke:#D9B25C}
.st-future rect{stroke:#97A5B4;stroke-dasharray:6 4}
.st-next rect{stroke:#7FB9CC;stroke-dasharray:6 4}
.chip text{font-size:10px;font-weight:700;letter-spacing:.04em}
.ch-done rect{fill:#E8F3EC} .ch-done text{fill:#2F7D50}
.ch-amber rect{fill:#FAF0D7} .ch-amber text{fill:#9A6B00}
.ch-future rect{fill:#EDF1F6} .ch-future text{fill:#5D6B7A}
.ch-next rect{fill:#E3F1F6} .ch-next text{fill:#0E7C9C}
.art rect{fill:#E3F1F6;stroke:#7FB9CC;stroke-width:1.5}
.art .atag{font-size:10px;font-weight:700;letter-spacing:.12em;fill:#0E7C9C}
.art .atitle{font-size:16px;font-weight:700;fill:#1C2733}
.art .asub{font-size:11.5px;fill:#51616F}
.flow{fill:none;stroke:#51616F;stroke-width:1.8}
.ahead{fill:#51616F}
.rail rect{fill:#FFFFFF;stroke:#C3CFDA;stroke-width:1}
.rail text{font-size:11px;font-weight:600;fill:#51616F}
.rail .railnote{font-weight:400;font-size:11.5px}
.pnote rect{fill:#FFFFFF;stroke:#97A5B4;stroke-dasharray:5 4;stroke-width:1.2}
.pnote text{font-size:11px;font-weight:600;fill:#51616F;letter-spacing:.02em}
.pwarn rect{fill:#FFF9EC;stroke:#D9B25C;stroke-dasharray:5 4;stroke-width:1.2}
.pwarn text{font-size:11px;font-weight:600;fill:#8A6100;letter-spacing:.02em}
</style>
<rect x="0" y="0" width="1240" height="756" fill="#F7F9FB"/>
  <rect class="lane lane-c" x="24" y="20" width="1192" height="272" rx="14"/>
  <text class="lanelabel" x="46" y="48">CONTAINERS · Geant4 via CVMFS (apptainer, offline)</text>
  <text class="lanenote" x="1194" y="48" text-anchor="end">runs only when content / statistics change</text>
  <rect class="lane lane-l" x="24" y="426" width="1192" height="310" rx="14"/>
  <text class="lanelabel" x="46" y="454">LOCAL · ROOT 6.40 / gcc — detached</text>
  <text class="lanenote" x="1194" y="454" text-anchor="end">iterate in seconds–minutes · no BNL, no container</text>

  <g class="node st-done">
    <rect x="48" y="62" width="250" height="100" rx="10"/>
    <text class="eyebrow" x="64" y="84">STAGE 1</text>
    <text class="ntitle" x="64" y="106">Event generation</text>
    <text class="nsub mono" x="64" y="124">sHijing → HepMC (pau200 + a–d)</text>
    <g class="chip ch-done">
      <rect x="64" y="134" width="150" height="20" rx="10"/>
      <text x="139" y="148" text-anchor="middle">PROVENANCE-SEALED ✓</text>
    </g>
  </g>

  <g class="node st-done">
    <rect x="336" y="62" width="250" height="100" rx="10"/>
    <text class="eyebrow" x="352" y="84">STAGE 2 · RETIRED</text>
    <text class="ntitle" x="352" y="106">Pileup mixing</text>
    <text class="nsub mono" x="352" y="124">→ local frame_composer.C</text>
    <g class="chip ch-done">
      <rect x="352" y="134" width="196" height="20" rx="10"/>
      <text x="450" y="148" text-anchor="middle">DETACHED VIA COMPOSER ✓</text>
    </g>
  </g>

  <g class="node st-amber">
    <rect x="624" y="62" width="250" height="100" rx="10"/>
    <text class="eyebrow" x="640" y="84">STAGE 3a · ANA.331 (SL7)</text>
    <text class="ntitle" x="640" y="106">Geant4 — legacy chain</text>
    <text class="nsub mono" x="640" y="124">run_one.sh · gcc-8.3 · ROOT 6.24</text>
    <g class="chip ch-amber">
      <rect x="640" y="134" width="192" height="20" rx="10"/>
      <text x="736" y="148" text-anchor="middle">SOURCE OF ALL 6 PROD LIBS</text>
    </g>
  </g>

  <g class="node st-next">
    <rect x="624" y="176" width="250" height="100" rx="10"/>
    <text class="eyebrow" x="640" y="198">STAGE 3b · ANA.558 (ALMA9)</text>
    <text class="ntitle" x="640" y="220">Geant4 — modern chain</text>
    <text class="nsub mono" x="640" y="238">run_pilot_ctr.sh · local CDB map</text>
    <g class="chip ch-next">
      <rect x="640" y="248" width="188" height="20" rx="10"/>
      <text x="734" y="262" text-anchor="middle">PILOT ✓ · PROD GATED ON P5</text>
    </g>
  </g>

  <g class="node st-done">
    <rect x="912" y="62" width="250" height="100" rx="10"/>
    <text class="eyebrow" x="928" y="84">G4 DUMP</text>
    <text class="ntitle" x="928" y="106">Deposit dump</text>
    <text class="nsub mono" x="928" y="124">SvtxEvaluator / dump_g4hits.C</text>
    <g class="chip ch-done">
      <rect x="928" y="134" width="150" height="20" rx="10"/>
      <text x="1003" y="148" text-anchor="middle">BOTH CHAINS ✓</text>
    </g>
  </g>

  <g class="pwarn">
    <rect x="48" y="188" width="538" height="88" rx="8"/>
    <text x="64" y="210">P5 VERDICT (2026-07-15): generator content ×2–2.7 vs real —</text>
    <text x="64" y="228">confirmed by rmbd = 350 kHz (→ inelastic ~540–640 kHz vs fitted 297)</text>
    <text x="64" y="246">and by the drift-edge step. Modern G4 ≈ old G4 (×1.1): NOT a sim defect.</text>
    <text x="64" y="264">Fix = HIJING tune / library thinning / generator swap → supervisor.</text>
  </g>

  <g class="art art-acc">
    <rect x="470" y="310" width="330" height="88" rx="10"/>
    <text class="atag" x="486" y="332">HANDOFF ARTIFACT</text>
    <text class="atitle mono" x="486" y="358">ntp_g4hit</text>
    <text class="asub" x="486" y="380">deposits + truth + times — never invalidated</text>
  </g>

  <g class="art art-acc">
    <rect x="912" y="310" width="280" height="88" rx="10"/>
    <text class="atag" x="928" y="332">REAL-DATA ARTIFACT</text>
    <text class="atitle mono" x="928" y="358">run 79507 ntuplizer</text>
    <text class="asub" x="928" y="380">25.7M TPC hits · rmbd 350 kHz</text>
  </g>

  <g class="node st-done">
    <rect x="48" y="486" width="250" height="110" rx="10"/>
    <text class="eyebrow" x="64" y="510">STAGES 4–5 · A + COMPOSE + B</text>
    <text class="ntitle" x="64" y="532">TPC response + frames</text>
    <text class="nsub mono" x="64" y="550">tpc_digitize + frame_composer</text>
    <g class="chip ch-done">
      <rect x="64" y="562" width="150" height="20" rx="10"/>
      <text x="139" y="576" text-anchor="middle">v3.6revF SEALED ✓</text>
    </g>
  </g>

  <g class="node st-done">
    <rect x="336" y="486" width="250" height="110" rx="10"/>
    <text class="eyebrow" x="352" y="510">STAGES 6–7</text>
    <text class="ntitle" x="352" y="532">Island clustering + truth</text>
    <text class="nsub mono" x="352" y="550">islandize.C · islandize91.C</text>
    <g class="chip ch-done">
      <rect x="352" y="562" width="180" height="20" rx="10"/>
      <text x="442" y="576" text-anchor="middle">DETACHED ✓ · 91-BR + TRUTH</text>
    </g>
  </g>

  <g class="node st-done">
    <rect x="624" y="486" width="250" height="110" rx="10"/>
    <text class="eyebrow" x="640" y="510">STAGE 8 · P4</text>
    <text class="ntitle" x="640" y="532">Prod. clusterizer port</text>
    <text class="nsub mono" x="640" y="550">prodclus.C · fixed_window=0</text>
    <g class="chip ch-done">
      <rect x="640" y="562" width="130" height="20" rx="10"/>
      <text x="705" y="576" text-anchor="middle">GATE +1.9% ✓</text>
    </g>
  </g>

  <g class="node st-next">
    <rect x="912" y="486" width="250" height="110" rx="10"/>
    <text class="eyebrow" x="928" y="510">STAGE 9</text>
    <text class="ntitle" x="928" y="532">ML training</text>
    <text class="nsub mono" x="928" y="550">prodclus_v36.root · 7.75M truth</text>
    <g class="chip ch-next">
      <rect x="928" y="562" width="130" height="20" rx="10"/>
      <text x="993" y="576" text-anchor="middle">DATASET READY</text>
    </g>
  </g>

  <g class="pnote">
    <rect x="48" y="614" width="550" height="44" rx="8"/>
    <text x="64" y="632">P3 ✓ SEALED v3.6revF — 250 pAu frames · MBD trigger 0.41 + empirical envelope</text>
    <text x="64" y="649">φ2 0.271 (real 0.266) · step 1.150 (1.130) · kept/fr +0.9% · windows in ±5% floor</text>
  </g>
  <g class="pnote">
    <rect x="624" y="614" width="538" height="44" rx="8"/>
    <text x="640" y="632">P5 · pilot ✓ (2 ev, ana.558, fully offline) — production + generator fix pending the</text>
    <text x="640" y="649">tune / thin / swap decision · 13-layer offline recipe ledgered + reusable</text>
  </g>

  <g class="rail">
    <rect x="48" y="676" width="250" height="42" rx="10"/><text x="173" y="694" text-anchor="middle">CDB_offline → BOTH chains ✓</text>
    <text x="173" y="710" text-anchor="middle">(ana.558 via cdb_local.txt · 178 domains)</text>
    <rect x="336" y="676" width="250" height="42" rx="10"/><text x="461" y="702" text-anchor="middle">validation harness + gates ✓</text>
    <rect x="624" y="676" width="250" height="42" rx="10"/><text x="749" y="702" text-anchor="middle">run_one.sh · run_pilot_ctr.sh ✓</text>
    <text class="railnote" x="912" y="692">file-based support — feeds both lanes;</text>
    <text class="railnote" x="912" y="708">no network, no rebuild</text>
  </g>

  <path class="flow" d="M 298,112 L 332,112" marker-end="url(#ah)"/>
  <path class="flow" d="M 586,112 L 620,112" marker-end="url(#ah)"/>
  <path class="flow" d="M 874,112 L 908,112" marker-end="url(#ah)"/>
